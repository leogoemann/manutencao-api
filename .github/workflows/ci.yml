name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - run: bin/rubocop -f github

  seguranca:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Brakeman
        run: bin/brakeman --no-pager
      - name: bundler-audit
        run: bin/bundler-audit check --update
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  testes:
    runs-on: ubuntu-latest
    needs: [ lint ]
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bundle exec rspec
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: api/coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
